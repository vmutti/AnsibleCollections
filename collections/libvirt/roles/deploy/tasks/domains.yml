- name: Declare empty guest configs
  set_fact:
    libvirt_guest_configs: []

- name: "Show libvirt guests in {{ libvirt_guest_group }}"
  debug:
    var: "groups[libvirt_guest_group]"

- name: "Build domain config for guests hosted on {{ libvirt_hypervisor_identifier }}"
  include_tasks: add_domain_config.yml
  loop: "{{ groups[libvirt_guest_group] | default([]) }}"
  loop_control:
    loop_var: libvirt_guest_name
  when: hostvars[libvirt_guest_name].libvirt_hypervisor | default('') == libvirt_hypervisor_identifier

- name: Show libvirt guest domain configs
  debug:
    var: libvirt_guest_configs
    verbosity: 2

- name: Declare empty guest volume definitions
  set_fact:
    libvirt_guest_volumes: []

- name: "Collect extra storage volumes for guests hosted on {{ libvirt_hypervisor_identifier }}"
  set_fact:
    libvirt_guest_volumes: "{{ libvirt_guest_volumes + (libvirt_guest.volumes | default([])) }}"
  loop: "{{ libvirt_guest_configs }}"
  loop_control:
    loop_var: libvirt_guest
    label: "{{ libvirt_guest.name }}"

- name: Show extra storage volume definitions
  debug:
    var: libvirt_guest_volumes
    verbosity: 2

- name: "Validate extra storage volumes set pool, name and capacity_gb"
  assert:
    that:
      - libvirt_volume.pool is defined
      - libvirt_volume.name is defined
      - libvirt_volume.capacity_gb is defined
    fail_msg: >-
      Guest volume {{ libvirt_volume }} must set pool, name and capacity_gb (and
      target_dev, to actually attach it to a domain).
  loop: "{{ libvirt_guest_volumes }}"
  loop_control:
    loop_var: libvirt_volume
    label: "{{ libvirt_volume.name | default('(unnamed)') }}"

- name: "Define extra storage volumes for guests hosted on {{ libvirt_hypervisor_identifier }}"
  community.libvirt.virt_volume:
    uri: "{{ libvirt_uri }}"
    pool: "{{ libvirt_volume.pool }}"
    state: present
    xml: "{{ lookup('template', 'volume.xml.j2') }}"
  loop: "{{ libvirt_guest_volumes }}"
  loop_control:
    loop_var: libvirt_volume
    label: "{{ libvirt_volume.name }}"

# virt_volume's "present" only creates the volume if it's missing, and never
# reconciles ownership/mode on one that already exists - so a volume.xml.j2
# permissions block only ever takes effect the moment a volume is first
# created. libvirt's own dynamic_ownership relabeling doesn't reliably pick up
# the slack for pool-backed volumes either (see libvirt_volume_owner in
# defaults/main.yml), so the role resolves and fixes up ownership itself,
# every run, instead of trusting either of those.
- name: "Resolve real paths of extra storage volumes for guests hosted on {{ libvirt_hypervisor_identifier }}"
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_uri }}"
      - vol-path
      - --pool
      - "{{ libvirt_volume.pool }}"
      - "{{ libvirt_volume.name }}"
  changed_when: false
  loop: "{{ libvirt_guest_volumes }}"
  loop_control:
    loop_var: libvirt_volume
    label: "{{ libvirt_volume.name }}"
  register: libvirt_volume_paths

- name: "Ensure extra storage volumes are owned by the qemu runtime user on {{ libvirt_hypervisor_identifier }}"
  become: true
  ansible.builtin.file:
    path: "{{ libvirt_volume_path.stdout }}"
    owner: "{{ libvirt_volume_path.libvirt_volume.permissions.owner | default(libvirt_volume_owner) }}"
    group: "{{ libvirt_volume_path.libvirt_volume.permissions.group | default(libvirt_volume_group) }}"
    mode: "{{ libvirt_volume_path.libvirt_volume.permissions.mode | default(libvirt_volume_mode) }}"
  loop: "{{ libvirt_volume_paths.results }}"
  loop_control:
    loop_var: libvirt_volume_path
    label: "{{ libvirt_volume_path.libvirt_volume.name }}"

- name: "Ensure disk image destination directories exist on {{ libvirt_hypervisor_identifier }}"
  ansible.builtin.file:
    path: "{{ libvirt_guest.disk_path | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"
  become: true
  loop: "{{ libvirt_guest_configs }}"
  loop_control:
    loop_var: libvirt_guest
    label: "{{ libvirt_guest.name }}"
  when: libvirt_guest.image_path is defined and libvirt_guest.disk_path is defined

- name: "Upload guest disk images from the controller to {{ libvirt_hypervisor_identifier }}"
  ansible.builtin.copy:
    src: "{{ libvirt_guest.image_path }}"
    dest: "{{ libvirt_guest.disk_path }}"
    mode: preserve
  loop: "{{ libvirt_guest_configs }}"
  loop_control:
    loop_var: libvirt_guest
    label: "{{ libvirt_guest.name }}"
  when: libvirt_guest.image_path is defined and libvirt_guest.disk_path is defined

- name: Define libvirt guest domains
  community.libvirt.virt:
    uri: "{{ libvirt_uri }}"
    command: define
    xml: "{{ lookup('template', 'domain.xml.j2') }}"
  loop: "{{ libvirt_guest_configs }}"
  loop_control:
    loop_var: libvirt_guest
    label: "{{ libvirt_guest.name }}"

- name: Set libvirt guest domain autostart
  community.libvirt.virt:
    uri: "{{ libvirt_uri }}"
    name: "{{ libvirt_guest.name }}"
    autostart: "{{ (libvirt_guest.autostart | default(false)) | bool }}"
  loop: "{{ libvirt_guest_configs }}"
  loop_control:
    loop_var: libvirt_guest
    label: "{{ libvirt_guest.name }}"

- name: Ensure libvirt guest domains are in the desired state
  community.libvirt.virt:
    uri: "{{ libvirt_uri }}"
    name: "{{ libvirt_guest.name }}"
    state: "{{ libvirt_guest.state | default(libvirt_guest_default_state) }}"
  loop: "{{ libvirt_guest_configs }}"
  loop_control:
    loop_var: libvirt_guest
    label: "{{ libvirt_guest.name }}"
