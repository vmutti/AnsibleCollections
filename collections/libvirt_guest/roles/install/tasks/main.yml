- name: "Install QEMU guest agent if necessary"
  when: "'host_install_libvirt_guest' in group_names"
  block:
    - name: "Installing qemu-guest-agent package"
      become: true
      apt:
        update_cache: yes
        pkg:
          - qemu-guest-agent

    # Only enable here, don't state: started. qemu-guest-agent.service
    # BindsTo the virtio-serial device unit for
    # /dev/virtio-ports/org.qemu.guest_agent.0, which doesn't exist yet in the
    # Packer-built VM (Packer's qemu builder never attaches that channel) —
    # trying to start it here fails with "A dependency job for
    # qemu-guest-agent.service failed". Enabling is enough: once this image is
    # booted as a real libvirt guest with the channel attached (see
    # vmutti.libvirt.deploy), udev creates the device unit and systemd starts
    # the service automatically via that binding.
    - name: "Enable qemu-guest-agent"
      become: true
      systemd:
        name: qemu-guest-agent
        enabled: true
